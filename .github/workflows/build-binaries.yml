name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GitHubリリース作成に必要な権限を追加
permissions:
  contents: write

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: markdown_to_testcase
            asset_name: markdown_to_testcase-linux-x86_64
          - os: windows-latest
            artifact_name: markdown_to_testcase.exe
            asset_name: markdown_to_testcase-windows-x86_64.exe
          - os: macos-latest
            artifact_name: markdown_to_testcase
            asset_name: markdown_to_testcase-macos-x86_64
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e .
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name markdown_to_testcase markdown_to_testcase/__main__.py
    
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}
    
    - name: List artifacts directory
      run: ls -l artifacts/

    - name: Add to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/markdown_to_testcase-windows.exe/markdown_to_testcase.exe
          artifacts/markdown_to_testcase-macos/markdown_to_testcase
          artifacts/markdown_to_testcase-linux/markdown_to_testcase
        draft: false
        prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        name: ${{ github.ref_name }}
        body: |
          ## ${{ github.ref_name }} リリース
          
          ### マークダウンからテストケースへの変換ツール
          
          このリリースには次のバイナリが含まれています：
          
          | プラットフォーム | ダウンロードリンク |
          |--------------|------------------|
          | Windows | [markdown_to_testcase-windows-x86_64.exe](https://github.com/tkykszk/markdown_to_testcase/releases/download/${{ github.ref_name }}/markdown_to_testcase-windows-x86_64.exe) |
          | macOS | [markdown_to_testcase-macos-x86_64](https://github.com/tkykszk/markdown_to_testcase/releases/download/${{ github.ref_name }}/markdown_to_testcase-macos-x86_64) |
          | Linux | [markdown_to_testcase-linux-x86_64](https://github.com/tkykszk/markdown_to_testcase/releases/download/${{ github.ref_name }}/markdown_to_testcase-linux-x86_64) |
          
          常に最新版にアクセスするには以下のURLを使用できます：
          
          ```
          https://github.com/tkykszk/markdown_to_testcase/releases/latest/download/[ファイル名]
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
