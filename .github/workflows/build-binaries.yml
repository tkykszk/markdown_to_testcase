name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: markdown_to_testcase
            asset_name: markdown_to_testcase-linux-x86_64
          - os: windows-latest
            artifact_name: markdown_to_testcase.exe
            asset_name: markdown_to_testcase-windows-x86_64.exe
          - os: macos-latest
            artifact_name: markdown_to_testcase
            asset_name: markdown_to_testcase-macos-x86_64
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -e .
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --name markdown_to_testcase markdown_to_testcase/__main__.py
    
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: dist/${{ matrix.artifact_name }}
    
    - name: Add to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/${{ matrix.artifact_name }}
        draft: false
        prerelease: false
