name: Update Latest Tags

# ワークフローファイルを含むタグの更新はGitHub Actionsから直接できないため、このワークフローは無効化されています。
# タグの更新が必要な場合は、ローカルで行うか、リポジトリ設定で「Allow GitHub Actions to create and approve pull requests」を有効にする必要があります。

on:
  release:
    types: [published]
  workflow_dispatch:

# GitHubリリース作成に必要な権限を追加
permissions:
  contents: write

jobs:
  update-latest-tags:
    runs-on: ubuntu-latest
    if: false  # ワークフロー全体を無効化
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Extract version from tag
        id: extract_version
        run: |
          # タグからvプレフィックスを削除
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # メジャーとマイナーバージョンを抽出
          MAJOR_VERSION=$(echo $VERSION | cut -d. -f1)
          echo "major=$MAJOR_VERSION" >> $GITHUB_OUTPUT
          
          MINOR_VERSION=$(echo $VERSION | cut -d. -f2)
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          
          echo "major_minor=${MAJOR_VERSION}.${MINOR_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Update version tags only
        run: |
          # latestタグの更新はワークフローファイルの制限のため説明
          # GitHubの「Latest release」機能を使用するので代用可能
          
          # メジャーバージョンの最新タグを更新
          git tag -f v${{ steps.extract_version.outputs.major }}-latest
          git push https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/tkykszk/markdown_to_testcase.git v${{ steps.extract_version.outputs.major }}-latest -f
          
          # マイナーバージョンの最新タグを更新
          git tag -f v${{ steps.extract_version.outputs.major_minor }}-latest
          git push https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/tkykszk/markdown_to_testcase.git v${{ steps.extract_version.outputs.major_minor }}-latest -f
